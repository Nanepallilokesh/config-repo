spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.jpa.hibernate.ddl-auto=update
spring.mail.properties.mail.debug=true

# Logging pattern with trace and span IDs
logging.pattern.level=%5p [${spring.application.name},%X{traceId},%X{spanId}]

# Actuator endpoint exposure
management.endpoints.web.exposure.include=health,info,metrics,env,loggers

# Health details
management.endpoint.health.show-details=always

# Zipkin tracing endpoint
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# Sampling probability (100%)
management.tracing.sampling.probability=1.0

# Propagation type
management.tracing.propagation.type=B3

#Kafka configurations
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.policycraft.notificationService.model
spring.kafka.consumer.properties.spring.json.value.default.type=com.policycraft.notificationService.model.EmailRequest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.notification-topic=notification-events
