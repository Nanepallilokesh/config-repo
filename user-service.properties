spring.application.name=user-service
server.port=8082

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/InsuranceDataBase?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Lokesh4321.

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Logging pattern with trace and span IDs
logging.pattern.level=%5p [${spring.application.name},%X{traceId},%X{spanId}]

# Actuator endpoint exposure
management.endpoints.web.exposure.include=health,info,metrics,env,loggers

# Health details
management.endpoint.health.show-details=always

# Zipkin tracing endpoint
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# Sampling probability (100%)
management.tracing.sampling.probability=1.0

# Propagation type
management.tracing.propagation.type=B3
