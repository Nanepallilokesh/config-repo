spring.application.name=auth-service
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/InsuranceDataBase?createDatabaseIfNotExist=true
spring.datasource.password=Lokesh4321.

spring.datasource.username=root
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.app.jwtExpiration=86400000
spring.app.jwtSecret=insuranceSecretKet123456789InsuranceProjectSecureKey


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


resilience4j.circuitbreaker.instances.userServiceBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userServiceBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.userServiceBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userServiceBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userServiceBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.userServiceBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true





# Logging pattern with trace and span IDs
logging.pattern.level=%5p [${spring.application.name},%X{traceId},%X{spanId}]

# Actuator endpoint exposure
management.endpoints.web.exposure.include=health,info,metrics,env,loggers

# Health details
management.endpoint.health.show-details=always

# Zipkin tracing endpoint
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# Sampling probability (100%)
management.tracing.sampling.probability=1.0

# Propagation type
management.tracing.propagation.type=B3
