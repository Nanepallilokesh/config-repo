spring.application.name=renewal-service
server.port=8008

# ===============================
# Server
# ===============================


# ===============================
# Database (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/InsuranceDataBase?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Lokesh4321.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Disable Spring Cloud Config
# ===============================
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false


# Logging pattern with trace and span IDs
logging.pattern.level=%5p [${spring.application.name},%X{traceId},%X{spanId}]

# Actuator endpoint exposure
management.endpoints.web.exposure.include=health,info,metrics,env,loggers

# Health details
management.endpoint.health.show-details=always

# Zipkin tracing endpoint
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# Sampling probability (100%)
management.tracing.sampling.probability=1.0

# Propagation type
management.tracing.propagation.type=B3
